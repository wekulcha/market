services:
  postgres:
    image: postgres:16-alpine
    container_name: kulcha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kulcha
      POSTGRES_USER: kulcha
      POSTGRES_PASSWORD: kulcha
    ports:
      - "5432:5432"
    volumes:
      - kulcha-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kulcha -d kulcha"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kulcha-postgres-data:
